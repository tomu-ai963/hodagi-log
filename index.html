<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="原木しいたけのほだ木の植菌記録をブラウザに保存できるメモアプリ">
<meta name="theme-color" content="#5b3a1e">
<title>hodagi-log｜ほだ木 植菌記録メモ</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f6f3ec;
    --card: #ffffff;
    --line: #ded5c5;
    --text: #33291f;
    --sub: #7b6c58;
    --accent: #6b4423;
    --accent-dark: #543418;
    --danger: #a8402f;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 12px 48px;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 16px 12px;
    margin-bottom: 16px;
  }
  header .inner {
    max-width: 640px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0;
    font-size: 1.2rem;
    letter-spacing: .04em;
  }
  header p {
    margin: 4px 0 0;
    font-size: .8rem;
    opacity: .85;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 1rem;
    border-left: 4px solid var(--accent);
    padding-left: 8px;
  }
  .field { margin-bottom: 12px; }
  .row {
    display: flex;
    gap: 10px;
  }
  .row .field { flex: 1 1 0; min-width: 0; }
  label {
    display: block;
    font-size: .8rem;
    color: var(--sub);
    margin-bottom: 4px;
    font-weight: 700;
  }
  input, textarea, button {
    font-family: inherit;
    font-size: 16px;
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fffdf9;
    color: var(--text);
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .hint {
    font-size: .72rem;
    color: var(--sub);
    margin: 4px 0 0;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  .btn-add {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
  }
  .btn-add:active { background: var(--accent-dark); }
  .err {
    color: var(--danger);
    font-size: .8rem;
    margin: 0 0 10px;
    min-height: 1.2em;
  }
  .list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .list-head h2 { margin: 0; }
  .total {
    font-size: .78rem;
    color: var(--sub);
    white-space: nowrap;
  }
  ul#list { list-style: none; margin: 0; padding: 0; }
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--accent);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .item-date {
    font-size: .95rem;
    font-weight: 700;
  }
  .badges {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .badge {
    font-size: .78rem;
    background: #efe7d8;
    color: var(--accent-dark);
    border-radius: 999px;
    padding: 2px 10px;
    word-break: break-word;
  }
  .badge.count { background: #e2ecdd; color: #3c5c33; }
  .memo {
    margin: 8px 0 0;
    font-size: .88rem;
    color: var(--sub);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .btn-del {
    flex: none;
    background: #fff;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 6px 10px;
    font-size: .78rem;
    border-radius: 8px;
  }
  .btn-del:active { background: var(--danger); color: #fff; }
  .empty {
    text-align: center;
    color: var(--sub);
    font-size: .88rem;
    padding: 24px 8px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: #fffdf9;
  }
  footer {
    text-align: center;
    font-size: .72rem;
    color: var(--sub);
    padding: 8px 0 0;
  }
  @media (max-width: 380px) {
    .row { flex-direction: column; gap: 0; }
    header h1 { font-size: 1.05rem; }
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>hodagi-log</h1>
    <p>原木しいたけ ほだ木の植菌記録メモ</p>
  </div>
</header>

<div class="wrap">

  <section class="card">
    <h2>記録を追加</h2>
    <form id="form" novalidate>
      <div class="field">
        <label for="date">植菌日</label>
        <input type="date" id="date" required>
      </div>
      <div class="row">
        <div class="field">
          <label for="strain">菌種</label>
          <input type="text" id="strain" placeholder="例：森290" maxlength="40" required>
        </div>
        <div class="field">
          <label for="count">本数</label>
          <input type="number" id="count" placeholder="例：30" min="1" max="100000" step="1" inputmode="numeric" required>
        </div>
      </div>
      <div class="field">
        <label for="memo">メモ（任意）</label>
        <textarea id="memo" placeholder="例：コナラ、直径10cm前後。裏の杉林に仮伏せ。" maxlength="500"></textarea>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button type="submit" class="btn-add">この内容で追加する</button>
      <p class="hint">記録はこの端末のブラウザ（localStorage）にのみ保存されます。</p>
    </form>
  </section>

  <section>
    <div class="list-head">
      <h2>植菌の記録</h2>
      <span class="total" id="total"></span>
    </div>
    <ul id="list"></ul>
  </section>

  <footer>hodagi-log — データは端末内に保存されます</footer>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'hodagi-log:records:v1';
  var form = document.getElementById('form');
  var elDate = document.getElementById('date');
  var elStrain = document.getElementById('strain');
  var elCount = document.getElementById('count');
  var elMemo = document.getElementById('memo');
  var elErr = document.getElementById('err');
  var elList = document.getElementById('list');
  var elTotal = document.getElementById('total');

  var records = [];

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      records = Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      records = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(records));
      return true;
    } catch (e) {
      elErr.textContent = '保存に失敗しました。ブラウザの保存容量や設定をご確認ください。';
      return false;
    }
  }

  function todayStr() {
    var d = new Date();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function formatDate(iso) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!p) return iso || '日付なし';
    var w = ['日', '月', '火', '水', '木', '金', '土'];
    var d = new Date(Number(p[1]), Number(p[2]) - 1, Number(p[3]));
    var wd = isNaN(d.getTime()) ? '' : '（' + w[d.getDay()] + '）';
    return Number(p[1]) + '年' + Number(p[2]) + '月' + Number(p[3]) + '日' + wd;
  }

  function sorted() {
    return records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function render() {
    var items = sorted();
    elList.innerHTML = '';

    if (items.length === 0) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'まだ記録がありません。上のフォームから植菌の記録を追加してください。';
      elList.appendChild(li);
      elTotal.textContent = '';
      return;
    }

    var totalLogs = 0;
    items.forEach(function (r) {
      totalLogs += Number(r.count) || 0;

      var li = document.createElement('li');
      li.className = 'item';

      var top = document.createElement('div');
      top.className = 'item-top';

      var left = document.createElement('div');
      var date = document.createElement('div');
      date.className = 'item-date';
      date.textContent = formatDate(r.date);
      left.appendChild(date);

      var badges = document.createElement('div');
      badges.className = 'badges';
      var b1 = document.createElement('span');
      b1.className = 'badge';
      b1.textContent = '菌種：' + r.strain;
      var b2 = document.createElement('span');
      b2.className = 'badge count';
      b2.textContent = r.count + ' 本';
      badges.appendChild(b1);
      badges.appendChild(b2);
      left.appendChild(badges);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn-del';
      del.textContent = '削除';
      del.setAttribute('aria-label', formatDate(r.date) + ' の記録を削除');
      del.addEventListener('click', function () { remove(r.id, r); });

      top.appendChild(left);
      top.appendChild(del);
      li.appendChild(top);

      if (r.memo) {
        var memo = document.createElement('p');
        memo.className = 'memo';
        memo.textContent = r.memo;
        li.appendChild(memo);
      }

      elList.appendChild(li);
    });

    elTotal.textContent = items.length + ' 件 / 合計 ' + totalLogs + ' 本';
  }

  function remove(id, r) {
    var msg = formatDate(r.date) + '「' + r.strain + ' ' + r.count + '本」の記録を削除します。よろしいですか？';
    if (!window.confirm(msg)) return;
    records = records.filter(function (x) { return x.id !== id; });
    save();
    render();
  }

  function newId() {
    return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    elErr.textContent = '';

    var date = elDate.value;
    var strain = elStrain.value.trim();
    var countRaw = elCount.value.trim();
    var memo = elMemo.value.trim();

    if (!date) { elErr.textContent = '植菌日を入力してください。'; elDate.focus(); return; }
    if (!strain) { elErr.textContent = '菌種を入力してください。'; elStrain.focus(); return; }
    var count = parseInt(countRaw, 10);
    if (!countRaw || isNaN(count) || count < 1) {
      elErr.textContent = '本数は1以上の数値で入力してください。';
      elCount.focus();
      return;
    }

    records.push({
      id: newId(),
      date: date,
      strain: strain,
      count: count,
      memo: memo,
      createdAt: Date.now()
    });

    if (!save()) return;
    render();

    elStrain.value = '';
    elCount.value = '';
    elMemo.value = '';
    elDate.value = date;
    elStrain.focus();
  });

  load();
  elDate.value = todayStr();
  render();
})();
</script>
</body>
</html>
